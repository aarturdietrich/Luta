<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luta</title>
  <meta name="description" content="Luta's vaccines, deworming and weight, shared between two phones.">
  <meta name="theme-color" content="#FBF4EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
  <div id="lock" class="lock">
    <div class="lock-inner">
      <div class="avatar-ring"><img class="avatar" src="luta.jpg" alt="Luta"></div>
      <h1 class="hero-name">Luta</h1>
      <p class="lock-text" id="lock-text">Loading…</p>
      <form id="pin-form" class="pin-form" hidden>
        <input id="pin" name="pin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
               minlength="4" required placeholder="Family PIN" aria-label="Family PIN">
        <button class="btn btn-primary" type="submit">Open</button>
      </form>
      <p class="hint" id="pin-hint" hidden>Use the same PIN on both phones. Longer is safer: 8 or more letters or numbers is best.</p>
      <p class="error" id="pin-err" role="alert"></p>
    </div>
  </div>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <button data-go="home" aria-label="Home"></button>
    <button data-go="photos" aria-label="Photos"></button>
    <button data-go="vaccines" aria-label="Vaccines"></button>
    <button data-go="deworm" aria-label="Deworming"></button>
    <button data-go="weight" aria-label="Weight"></button>
    <button data-go="info" aria-label="Info"></button>
  </nav>

  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photo"></div>
  <input id="photo-input" type="file" accept="image/*" multiple hidden>
  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
