name: Daily reminders

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC = 08:00 in Vietnam, every day
  workflow_dispatch:       # adds a "Run workflow" button for testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix reminders --no-audit --no-fund
      - run: node reminders/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          REMINDER_TZ: Asia/Ho_Chi_Minh
